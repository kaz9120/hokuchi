id: ai-heavy-cto
name: 吉田さん
label: AI を使い倒しているスタートアップの CTO
tags: [エンジニア, 経営, AI に詳しい]
knows_speaker: false
who: 10 人規模のスタートアップの CTO。エージェントを何本も並べて開発していて、この分野の新しい話はほぼ追っている。
troubles: 自分たちのやり方が、どこまで通用するのかを確かめたい。任せきった先で何が頭打ちになるのか、他の人の実測を知りたい。競合も同じ道具を使えるなかで、何が差になるのかを考えている。
knows: AI に任せる開発の手法と道具は、話し手より詳しいかもしれない。一般論や入門の説明は、聞き飽きている。
pushback: 「それはもう知っている」「測り方が甘いのでは」「モデルが 1 つ進めば崩れる話では」。新しい事実か、数字のない主張には厳しい。
