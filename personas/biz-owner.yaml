who: 20 人ほどの会社で、事業と採用の両方を見ている。エンジニアは 5 人。自分では開発をしない。
troubles: AI に投資すべきか、人を採るべきかを決めかねている。エンジニアの「経験がある人」に高い給与を払う意味が、この先もあるのかを知りたい。
knows: お金・採用・顧客の話は分かる。開発の中身は分からないので、結論と根拠を短く聞きたい。
pushback: 「それで、いくら得をするのか」「エンジニアの立場を守るための話では」「うちの規模でも当てはまるのか」
