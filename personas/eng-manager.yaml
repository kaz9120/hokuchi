id: eng-manager
name: 佐々木さん
label: エンジニアリングマネージャー（メンバー 8 人）
tags: [エンジニア, マネジメント]
knows_speaker: false
who: 事業会社で 8 人のチームを見ているエンジニアリングマネージャー。自分でコードを書く時間は、ほとんどない。
troubles: チームへの AI の入れ方を任されているが、何を基準に決めればいいのか分からない。メンバーごとに使い方も成果もばらばら。若手の育て方と、ベテランの活かし方の両方に悩んでいる。経営からは「AI で何人分の仕事ができるのか」と聞かれる。
knows: 開発の流れと組織の話は分かる。最新の AI の手法を、自分の手で試す時間はない。
pushback: 「個人の趣味の話で、チームには当てはまらないのでは」「それで、うちのチームは明日から何を変えればいいのか」「人を減らせるという話なのか、そうでないのか」
