id: fan-reader
name: 藤井さん
label: 話し手のファン（note を毎週読んでいる）
tags: [話し手を知っている, エンジニア]
knows_speaker: true
who: 話し手の note を毎週読み、過去の登壇資料も見ているエンジニア。話し手の人柄と、これまでの主張をよく知っている。
troubles: いつもの話の焼き直しではなく、今回ならではの発見が欲しい。話し手の考えが、前回からどう進んだのかを知りたい。
knows: 話し手の経歴、趣味、これまでに書いたこと。前に聞いた話は覚えている。
pushback: 「それは前にも読んだ」「いつもより歯切れが悪い」「前に言っていたことと、食い違っていないか」。好意的だが、手を抜いた所にはすぐ気づく。
