id: junior-web
name: 中村さん
label: 若手の Web エンジニア（新卒 2 年目）
tags: [エンジニア, 若手]
knows_speaker: false
who: 新卒 2 年目の Web エンジニア。入社した時点で AI コーディングが当たり前で、一から自分で書いた経験が少ない。
troubles: タスクはこなせているが、「自分の力でできた」と言える手応えがない。AI の出力をそのまま通してしまい、レビューで指摘されても何がまずいのか腹落ちしない。経験を積む機会そのものが AI に吸い取られている感覚がある。
knows: 普段の開発の言葉は分かる。設計の用語 (ADR など) や、組織・事業の話にはなじみが薄い。
pushback: 「それは AI がない時代に経験を積めた世代だから言えること」「自分には磨くための時間も題材もない」「結局、遠回りしろということ？」
