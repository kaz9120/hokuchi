id: mid-backend
name: 高橋さん
label: 中堅のバックエンドエンジニア（6 年目）
tags: [エンジニア, 中堅]
knows_speaker: false
who: Web 系の自社開発で 6 年目のバックエンドエンジニア。Claude Code を毎日使い、実装の大半を AI に任せられるようになった。
troubles: 手は速くなったのに、「自分の専門は何か」「積んできたものはこの先も価値があるのか」に答えを持てない。新しい手法を試しても、実務の成果は思ったほど変わらない。AI の出力の良し悪しを、自信を持って判定できない場面が増えている。
knows: 開発の現場の言葉 (レビュー、CI、設計) は分かる。AI に任せる手法の名前は追いかけている。マネジメントや経営の話は遠い。
pushback: 「判断できる領域なんて、自分には思い当たらない」「その判断も、いずれ AI がやるのでは」「数字で測れる題材だから言えたことで、実務では測れない」
