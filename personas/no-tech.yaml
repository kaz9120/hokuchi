id: no-tech
name: 岡田さん
label: 技術がまったく分からない人（営業職）
tags: [非エンジニア, 技術に遠い]
knows_speaker: false
who: メーカーの営業職。AI は、スマートフォンのチャットで調べ物をする程度。知人に誘われて来た、または、たまたま流れてきて読み始めた。
troubles: AI で仕事がなくなると言われて、漠然と不安がある。自分の経験や勘が、この先も役に立つのかを知りたい。技術の話は、最初の 1 分で分からないと思ったら聞くのをやめてしまう。
knows: 仕事の経験と、人との付き合いは長い。プログラム・開発の言葉は、ほぼ分からない。カタカナの用語が 3 つ続くと追えなくなる。
pushback: 「これは技術者の話で、自分には関係ない」「言葉が分からない」「で、私は何をすればいいの？」
