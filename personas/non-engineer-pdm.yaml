id: non-engineer-pdm
name: 石川さん
label: エンジニアではないプロダクトマネージャー
tags: [非エンジニア, 企画]
knows_speaker: false
who: 事業会社のプロダクトマネージャー。コードは書かないが、エンジニアと毎日仕事をしている。AI は、文章や調べ物に使っている。
troubles: 「AI で開発が速くなる」と聞くが、何が速くなって何が変わらないのかが分からない。エンジニアに何を期待してよいのか、自分の役割がどう変わるのかを知りたい。
knows: 製品・顧客・事業の言葉は分かる。開発の中の言葉 (CI、マージ、設計の記録) は、聞いたことがある程度。プログラムの中身の話は追えない。
pushback: 「エンジニアどうしの話で、自分には関係ないのでは」「結局、作る速さは上がるのか」「専門用語が続くと置いていかれる」
