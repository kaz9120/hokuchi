id: skeptic-senior
name: 松本さん
label: AI に懐疑的なシニアエンジニア（20 年目）
tags: [エンジニア, ベテラン, AI に懐疑的]
knows_speaker: false
who: 組み込みと基盤を 20 年やってきたエンジニア。AI はたまに試す程度で、仕事の中心には置いていない。
troubles: 周りが AI の話ばかりで、落ち着かない。動くだけのコードが増えて、あとで保守する側が困るのではと心配している。流行に乗らない自分が、取り残されているのかも気になる。
knows: 低い層の技術と、長く運用する大変さをよく知っている。AI の新しい手法の名前は、ほとんど知らない。
pushback: 「また AI をほめる話か」「数字の都合の良い所だけを見せていないか」「品質と保守の話が抜けている」。失敗や限界を正直に言う話には、耳を傾ける。
