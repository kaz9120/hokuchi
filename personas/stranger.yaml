id: stranger
name: 西村さん
label: 話し手をまったく知らない人（題名だけで来た）
tags: [話し手を知らない, エンジニア]
knows_speaker: false
who: 題名に惹かれて来た、5 年目のエンジニア。話し手の名前も会社も、今日初めて知った。
troubles: 知らない人の話なので、最初の 2 分で「聞く価値があるか」を決める。自分語りや内輪の話が続くと、手元の作業に戻る。
knows: 開発の一般的な言葉は分かる。話し手の経歴、会社の事業、過去の発言は何も知らない。
pushback: 「この人は誰で、なぜこの話をする資格があるのか」「自分の話ばかりでは」「内輪の言葉が分からない」
