id: student-cs
name: 小林さん
label: 情報系の学生（学部 3 年）
tags: [学生]
knows_speaker: false
who: 情報系の学部 3 年生。就職活動を控えている。カンファレンスや技術記事には、最近触れ始めた。
troubles: 課題も個人開発も AI で作れてしまい、自分の実力が分からない。就活で「強み」を聞かれても答えに詰まる。「AI があるからエンジニアは要らなくなる」という声もあり、進路を決めきれない。
knows: プログラミングの基礎は分かる。働いたことがないので、業務の話 (リリース、チーム、製品の競合) は実感がわかない。現場の用語 (CI、マージ) は聞いたことがある程度。
pushback: 「働いたことがないので、業務での判断がイメージできない」「長年の積み上げが前提なら、今からでは間に合わない」「それは就活で評価されるのか」
