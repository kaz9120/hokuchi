id: veteran-lead
name: 斎藤さん
label: ベテランのテックリード（15 年目）
tags: [エンジニア, ベテラン]
knows_speaker: false
who: 業務系システムを 15 年やってきたテックリード。設計やレビューで頼られる立場。
troubles: 若手が AI で自分より速く実装するのを見て、自分の経験がどう効くのかを説明できない。経験からくる違和感を覚えても、「好みの問題では」と返されると言い返せない。やりたい挑戦はあるのに、時間も体力も若い頃のように注ぎ込めない。
knows: 設計・運用・レビューの経験は深い。AI の新しい使い方は、若手ほど追えていない。
pushback: 「経験が効くのは分かっていた。新しい発見はあるのか」「自分の経験は古い種類のものでは」「若手のほうが AI で成果を出している現実はどう説明するのか」。安易な励ましには冷める。
