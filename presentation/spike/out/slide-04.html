<!doctype html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=1280">
<title>hokuchi slide spike</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
.slide{width:1280px;height:720px;position:relative;overflow:hidden;
  background:#0a0907;color:#ebe5d8;font-family:"LINE Seed JP", "Inter", sans-serif;font-weight:400;
  -webkit-font-smoothing:antialiased;letter-spacing:.01em}
.hi{color:#f47d3a;font-weight:700}
.stage{position:absolute;display:flex;flex-direction:column}
.stage.center{align-items:center;justify-content:center;text-align:center}
.stage.col{gap:0}
.stage-main{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;width:100%}
.center{display:flex;align-items:center;justify-content:center}

/* statement-stage */
.statement-hero{font-family:"LINE Seed JP", "Inter", sans-serif;font-weight:700;line-height:1.22;
  color:#f5f1e6;max-width:1000px}

/* title-stage — asymmetric bottom-left */
.title-band{align-items:flex-start;justify-content:flex-end}
.title-accent{width:76px;height:6px;background:#f47d3a;border-radius:3px;margin-bottom:28px}
.title-main{font-family:"LINE Seed JP", "Inter", sans-serif;font-weight:700;line-height:1.16;
  color:#f5f1e6;text-align:left}
.title-sub{color:#a8a094;margin-top:22px;text-align:left;letter-spacing:.04em}

/* section heading (diagram/chart/list top) */
.section-head{font-family:"LINE Seed JP", "Inter", sans-serif;font-weight:700;color:#ebe5d8;
  text-align:left;line-height:1.3;margin-bottom:24px;flex:0 0 auto}

/* bullets */
.bullets{list-style:none;margin-top:40px;display:flex;flex-direction:column;gap:34px;width:100%}
.bullets li{display:flex;align-items:baseline;gap:24px;font-size:34px;
  color:#ebe5d8;line-height:1.4}
.bullets .dot{flex:0 0 auto;width:12px;height:12px;border-radius:50%;
  background:#f47d3a;transform:translateY(-4px)}

/* quote */
.quote-block{max-width:960px;position:relative}
.quote-mark{font-family:"LINE Seed JP", "Inter", sans-serif;font-size:130px;line-height:.7;color:#3a342b;
  position:absolute;top:-42px;left:-18px;user-select:none}
.quote-text{font-family:"LINE Seed JP", "Inter", sans-serif;font-weight:700;font-size:46px;
  line-height:1.5;color:#f5f1e6;position:relative}
.quote-attr{margin-top:34px;font-size:24px;color:#a8a094;text-align:right}

/* diagram / chart wrappers */
.diagram-wrap,.chart-wrap{width:100%;height:100%;display:flex;justify-content:center;align-items:center}

/* grid-direct */
.grid-stage{position:absolute;inset:0;display:grid;gap:0}
.grid-cell{position:relative;overflow:hidden;display:flex}
.grid-caption{align-self:flex-end;padding:34px;font-family:"LINE Seed JP", "Inter", sans-serif;
  font-weight:700;font-size:38px;line-height:1.3;color:#f5f1e6}

/* image placeholder */
.img-ph{position:relative;width:100%;height:100%;background:#1a1814;
  display:flex;align-items:center;justify-content:center;overflow:hidden}
.img-inner{display:flex;flex-direction:column;align-items:center;gap:22px;
  padding:36px;max-width:88%;text-align:center}
.img-prompt{color:#a8a094;font-size:20px;line-height:1.6}
.img-badge{position:absolute;top:16px;left:16px;font-size:15px;letter-spacing:.14em;
  color:#a8a094;text-transform:uppercase;border:1px solid #3a342b;
  padding:4px 10px;border-radius:4px}
.img-corner{position:absolute;width:22px;height:22px;border:2px solid #3a342b;opacity:.9}
.img-corner.tl{top:14px;left:14px;border-right:0;border-bottom:0}
.img-corner.tr{top:14px;right:14px;border-left:0;border-bottom:0}
.img-corner.bl{bottom:14px;left:14px;border-right:0;border-top:0}
.img-corner.br{bottom:14px;right:14px;border-left:0;border-top:0}

.err{color:#f47d3a;font-size:28px}

body.single{margin:0;background:#0a0907}</style>
</head><body class="single"><div class="slide"><div class="grid-stage" style="grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(6,1fr)"><div class="grid-cell" style="grid-column:1 / 3;grid-row:1 / 7;"><div class="img-ph fill">
    <div class="img-corner tl"></div><div class="img-corner tr"></div>
    <div class="img-corner bl"></div><div class="img-corner br"></div>
    <div class="img-badge">IMAGE · prompt</div>
    <div class="img-inner"><svg width="52" height="52" viewBox="0 0 24 24" fill="none" stroke="#a8a094" stroke-width="1.4" style="opacity:.85">
    <rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="8.5" cy="9.5" r="1.8"/>
    <path d="M3 17l5-4 4 3 4-4 5 4"/></svg><div class="img-prompt">夜のキャンプ場で焚き火を囲む 3 人のエンジニア。炎の暖色光が顔を照らす。自然光なし、望遠、浅い被写界深度</div></div>
  </div></div><div class="grid-cell" style="grid-column:3 / 5;grid-row:3 / 5;"><div class="grid-caption">火を囲むように、聴衆と向き合う</div></div></div></div></body></html>
