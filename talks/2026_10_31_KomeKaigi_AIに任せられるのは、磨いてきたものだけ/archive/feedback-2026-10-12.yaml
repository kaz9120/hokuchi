# フィードバックの経緯。シーンごとに「誰が何を言い、どう考えて、何を変えたか」を残す (ADR-0037)。
# studio のボードが読み、シーンの下に出す。scene は絵コンテのシーン id。トーク全体の話は scene を "*" にする。
# status は 反映 / 見送り / 話者待ち のどれか。

rounds:
  - id: r1
    label: 1 周目（10/12・高橋と中村）
  - id: r1b
    label: 1 周目のやり直し（10/12・4 人）
  - id: speaker1
    label: 話者（10/12・Markdown を読んで）
  - id: repo
    label: himawari-rs の記録との照合（10/12）
  - id: r2
    label: 2 周目（10/12・4 人。7・6・7・7 点）
  - id: r3
    label: 3 周目（10/12・4 人。7・6・6・7 点）
  - id: speaker2
    label: 話者（10/12・studio で通して読んで）

entries:
  # ---------------------------------------------------------------- 全体
  - scene: "*"
    round: speaker1
    from: 話者
    feedback: 聴衆は将棋 AI のことをほとんど知らない。前半 10 分を将棋、後半 10 分を経験の話にする。将棋の話のゴールは、専門性や経験の大事さを渡すこと。
    thinking: 初版は将棋の記録で 20 分を使い切り、本題の「経験の話」が最後の 1 章に押し込まれていた。
    change: 前半（章 1〜4）を実験の記録、後半（章 5〜8）を経験の話に組み直した。
    status: 反映
  - scene: "*"
    round: r1b
    from: 4 人全員
    feedback: 中核メッセージは受け取れた。来た甲斐は「半分」。前半は聞きたかった話で、後半の「経験の積み方」が自分の悩みに届ききらない。
    thinking: 後半を支える仕事の側の実例が無い。将棋の具体と、仕事の抽象の落差が大きい。
    change: 将棋の中の例（NNUE）を足した。仕事の側の実例は話者が検討中。
    status: 話者待ち
  - scene: "*"
    round: r3
    from: 中村・小林
    feedback: 前半の数字が多すぎる。覚えられたのは 3400・3800・4000 だけ。点数、割合、局数、件数が次々に出る。
    thinking: 目盛りの上の数字は残す。話の中で 1 度しか出ない数字は落とす。
    change: コミット 846 件と、実戦 569 局を話から外した。持ち時間に合わせて削る段（Phase 6）で、さらに絞る。
    status: 反映
  - scene: "*"
    round: speaker2
    from: 話者
    feedback: 言語化能力が高い人の話、と見られると台無し。実践できる、まずやってみようと思える小さなプラクティスが要る。
    thinking: 話者が将棋でやっていたこと（理由を記録に残し、結果と見比べる）は、そのまま仕事に置き換えられる。「好みではないとどう確かめるか」への答えにもなる。
    change: hands-on に「2 案作らせて自分で決める／理由を 1 行残す／あとで結果と見比べる」を仮で置いた。話者の確認が要る。
    status: 話者待ち

  # ---------------------------------------------------------------- 冒頭
  - scene: question
    round: r1b
    from: 4 人全員
    feedback: 問いが 2 本ある。「経験の価値は下がったか」の直後に「手法を業務に入れる条件」が始まり、どちらが主題か迷う。
    thinking: 話者いわく、問いが 2 本あるのは事実。その構造を示せていないのが混乱の原因。
    change: 問いに「ある実験の結果から答えます。実験は別の問いから始めたものです」の橋を足した。
    status: 反映
  - scene: question
    round: r3
    from: 中村
    feedback: 問いが経験を積んできた人向けに聞こえる。自分の話だと思えたのは終盤だった。
    thinking: 冒頭で、これから積む人にも約束しておく。
    change: 「積み方は、最後に具体的に話します」を足した。
    status: 反映
  - scene: agenda
    round: speaker1
    from: 話者
    feedback: 内部的な問いを大きな問いと勘違いさせている。将棋 AI を題材にした部分には、別の問いがあって取り組んでいる。
    thinking: 左右 2 つの区画では、2 つの問いの関係が見えない。
    change: 外側に「今日の問い」、内側に「実験の問い」を置く入れ子の図に変えた。章扉（ch-work）でも同じ図を使う。
    status: 反映
  - scene: method-names
    round: speaker1
    from: 話者
    feedback: 「手法が何のための手段なのかを分かっていなかった」は違う。伝えたいのは、見よう見まねで導入しても仕事は変わらないことと、業務にいきなり入れるのは難しいこと。ただ、そろそろ無視できない。
    thinking: プロポーザルの文を、私が話者の反省として読み違えていた。
    change: 「見よう見まねでは変わらない／業務に入れにくい／ただ無視できない／自分で確かめる」に書き直した。
    status: 反映
  - scene: method-names
    round: r2
    from: 中村・小林・高橋
    feedback: 「どんな条件なら業務で効くか」が 3 本目の問いに聞こえる。答えが出る頃には問いを忘れている。若手と学生には、チームを作る側の話で遠い。
    thinking: 話者の動機なので消さない。問いの形にせず、「本当に任せきれるのかを確かめる」という動機 1 つに絞る。
    change: 4 状態を 3 状態に縮め、「どんな条件なら」という言い方をやめた。手法の名前には「覚えなくて大丈夫」を足した。
    status: 反映
  - scene: cant-verify
    round: speaker2
    from: 話者
    feedback: 実験の背景は、価値を数字で測れない → 手法が効いているか検証できない → 測れる分野で検証する → 将棋、という順序。
    thinking: 初版は「題材の条件 2 つ」から入っていて、なぜ将棋なのかの理由が後づけに見えた。
    change: この順序を、箱を 1 つずつ足す流れの図にした新しいシーンを作った。
    status: 反映
  - scene: cant-verify
    round: r2
    from: 小林
    feedback: 「価値」がいちばん引っかかった。仕事の価値が売上なのか使いやすさなのか、最後まで分からない。
    thinking: 働いたことのない人には定義が要る。
    change: 「使う人の役に立ったか、売上につながったか」を足し、「季節の要因」を「たまたま時期が良かったのか」に言い換えた。
    status: 反映
  - scene: setup
    round: r3
    from: 高橋
    feedback: ここで「私の承認は挟みません」と聞いたのに、あとで「最初の 2 週間は承認していた」と言われる。この図がいつの状態なのかが分からない。
    thinking: 記録では、7/29 まで ADR を 1 本ずつ承認していた。承認なしは 7/29 から今まで続いている。
    change: 「最初の 2 週間は 1 本ずつ承認していた。そのあと承認もやめて、いまはこの図のとおり」を足した。
    status: 反映
  - scene: goal
    round: speaker1
    from: 話者
    feedback: 「3 週間で 3452」がすごいのかどうか、前提を揃える必要がある。基準は gikou2_1c の 3300 点。トップは 4300〜4400。200 点差で勝率 76%。
    thinking: 数字の前に、ものさしを渡す。
    change: 縦の目盛りを作り、基準・トップの順に置いた。
    status: 反映
  - scene: goal
    round: speaker2
    from: 話者
    feedback: 4000 点は実験の成功条件。仕事を辞めて全力でやって、いまのマシンで出せる上限。「すぐに伸びる」は嘘かも。「人間が勝てない強さ」が価値として大きく見えているのが、後半で食い違う原因。
    thinking: 成功の線を結果より前に出せば、結果は最初から 4000 点に対して読まれる。
    change: このシーンを章 1 に移し、4000 点の線と実験の問いをここで置いた。「人間は勝てない」は目盛りの読み方の補足に下げた。
    status: 反映
  - scene: goal
    round: r2
    from: 小林
    feedback: 「4000 に届くなら、測りにくい分野でも効く」は、なぜそう言えるのか分からない。後半の結論とも逆向きに聞こえる。
    thinking: 言い過ぎだった。届いたら次は仕事で試す、までしか言えない。
    change: 「届くなら、次は仕事で試してみる価値があります」に弱めた。
    status: 反映

  # ---------------------------------------------------------------- 前半
  - scene: result
    round: repo
    from: 記録との照合
    feedback: 開始は 7/17、対局場への初参加は 7/24 で 3186 点。2 週間レーティングの系列と 3800 という値は、リポジトリに無い。
    thinking: 日付と最初の点数は記録に合わせる。3800 は話者の申告のまま使い、グラフは形だけのラフにしておく。
    change: 日付と 3186 を入れた。グラフの実データは未入手。
    status: 話者待ち
  - scene: result
    round: r3
    from: 斎藤・高橋（意図を確認済み）
    feedback: 3 か月で話者がどれだけ時間を使ったのかが出てこない。知りたい理由は 2 つ。「速く、安く」の「安く」に人の時間が入っているか。時間も体力もない自分に、同じことができる量か。
    thinking: 話者の答えは「仕事の片手間、趣味の範囲。10 年前の 10 分の 1 の労力」。2 人とも、AI の量（記録 227 本）の直後で聞きたいと答えた。
    change: 「コードを 1 行も書いていません」の直後に、かけた時間を足した。2 人は「週に何時間か」の目安があれば足りる、とも言っている。
    status: 反映
  - scene: six-losses
    round: repo
    from: 記録との照合
    feedback: 「口を出さずに 3400」は記録と合わない。7/29 までは ADR を 1 本ずつ承認していて、その時点は 3186 点。7/29 に承認をやめる指示を出し、その日に 6 件測って採択 0 件だった。
    thinking: 話者の段階分け（3400・3600・3800）を、記録の時系列に引き直す必要がある。
    change: 「最初の 2 週間は 1 つずつ積んで 3200 点 → 承認もやめた日に 6 件不採用」の順に書き直した。
    status: 反映
  - scene: six-losses
    round: r1
    from: 高橋・中村
    feedback: 「6 連敗」は対局で 6 回負けたように聞こえる。「教科書に載っている手」「定番の手」は将棋の指し手に聞こえる。
    thinking: 将棋の言葉と重なる言い方を避ける。
    change: 「6 件続けて不採用」「よく知られた改善」に統一した。
    status: 反映
  - scene: reading-adr
    round: r1b
    from: 斎藤
    feedback: 「公開ソフトを写したら 91%」は、経験というより手本があったからでは。
    thinking: 話者も「もっともで、伝え方が雑すぎる」。記録には、AI が「片方だけ移すと損をする」と自分で診断しながら「この部分から離れる」と結論し、話者が逆に「まとめて移す」と決めた経緯が残っていた。
    change: AI の結論と話者の判断が逆だった、という形に書き直した。11 のまとまりに分けたこと、移して弱くなったまとまりを分けたことも入れた。
    status: 反映
  - scene: reading-adr
    round: r3
    from: 斎藤
    feedback: 「良し悪しの判断を挟まない」と指示したのに、直後に採用の割合が出る。判定したのかどうか混乱した。
    thinking: 挟まないのは AI 自身の「ここは変えたほうが良さそう」で、対局の判定は続けている。
    change: その区別を書き足した。
    status: 反映
  - scene: reading-adr
    round: r3
    from: 斎藤
    feedback: 記録のどこを読んで、何が引っかかり、AI にどう指示したのか。違和感を言葉にして通す手順を見たい。
    thinking: 実物の記録（ADR-0104・0109）を画面で見せられると強い。どこを見せるかは話者と決める。
    change: まだ変えていない。画面はいま、note の記事の ADR の画像を仮に置いている。
    status: 話者待ち
  - scene: batting
    round: r1b
    from: 中村・斎藤・小林
    feedback: 7/29 は 2 週目で、翌日から 3 日間は 91%。なのに 3 週目は 27%。どちらが先なのか分からない。
    thinking: 記録では、追従（7/30〜8/1）が先で、27% に落ちたのはそのあと。初版は順序が逆だった。
    change: このシーンを追従のあとへ移し、棒を「67% → 43% → 91% → 27%」の順に並べた。週の区切りは note の記事の集計のままで、話者の確認が要る。
    status: 反映
  - scene: my-calls
    round: r1b
    from: 4 人全員
    feedback: 「経験をつぎ込んだ」の中身が 1 つも出てこない。いちばん聞きたい所。
    thinking: 話者は「話したほうが面白いか自信がない」。4 人全員が求めていて、前半の結論を支える唯一の根拠なので、短く入れる。記録に、発案が話者だと分かるものがあった。
    change: 3 つを新しいシーンにした。桂馬の詰みの見落とし（+11）、教師データの付け直し（+75）、外れた判断として配分の変更（−58）。
    status: 反映
  - scene: my-calls
    round: r2
    from: 斎藤・高橋・小林
    feedback: 外れた判断を出したのが良かった。安易な励ましではないと信じられた。
    thinking: 外れは残す。
    change: 変更なし。
    status: 見送り
  - scene: my-calls
    round: r3
    from: 高橋・中村・小林・斎藤
    feedback: 「AI」が、作る側の AI と将棋 AI の 2 つの意味で出てくる。「点数」も、対局場の点数と局面に付ける点数の 2 つがある。
    thinking: 同じ言葉を 2 つの意味で使わない。
    change: 付け直す相手を「もっと強い将棋ソフト」、局面の点数を「採点」と呼び分けた。「局面」は「盤面」にした。
    status: 反映
  - scene: ladder
    round: repo
    from: 記録との照合
    feedback: 追従は 3 日間で一巡し、3400 に届いたのは 8/2〜6。3600 は 9/14〜17 で、その間は評価関数とデータの積み上げ。9/17 から話者が方針を決めている。
    thinking: 話者の段階分けと記録が食い違うので、記録に沿って引き直す。話者の確認が要る。
    change: 3200（AI が 1 つずつ積んだ）、3400（まとめて移した）、3600（口を出すことが増えた）、3800（方針を決めている）にした。
    status: 話者待ち
  - scene: ladder
    round: r2
    from: 斎藤・小林
    feedback: 「200 点の差を作っているのは経験と専門性」には対照がない。3 つの例の点数を足しても 400 点にならない。
    thinking: 経験の取り分を点数で主張するのは無理がある。言えるのは「上がるほど関わりが増えた」まで。
    change: 「この差を作っているのは経験と専門性」を消し、「目盛りを上がるほど、私の関わりが増えています」にした。ラベルも短くした。
    status: 反映
  - scene: ai-profile
    round: r2
    from: 高橋
    feedback: 27% に落ちた直後に「私の印象」が挟まり、そのあと 9 月の例に飛ぶ。落ちた週に誰が何をしたのかが抜けている。
    thinking: 印象は、例と目盛りを見せたあとのほうが根拠がある。
    change: 並びを「27% に落ちた → 3 つの例 → 目盛り → 印象 → 意思決定は手放せていない」に変えた。
    status: 反映
  - scene: still-deciding
    round: r2
    from: 高橋・斎藤・小林
    feedback: 前半で経験が効いたのは「何をするかを決める」所。後半は「良し悪しを判定する力」の話になる。この 2 つが同じものだという説明が無い。
    thinking: 見分けられるから決められる、という順序がある。6 件の外れ方が同じだと気づいたのは、見分けたこと。
    change: 「読んで、うまくいっているかを見分ける。見分けられるから、次に何をするかを決められる」を足した。
    status: 反映

  # ---------------------------------------------------------------- 後半
  - scene: not-gacha
    round: speaker1
    from: 話者
    feedback: 放っておいても AI は試行錯誤の末に突破したと思う。ただ、それだけの時間とお金を使ってよいかは別の話。やりたいのはガチャではない。
    thinking: 話者の見立てであることを断って、そのまま入れる。
    change: 「いつか伸びを見つけたと思う → 時間とお金は別の話」のシーンにした。
    status: 反映
  - scene: not-gacha
    round: r2
    from: 4 人全員
    feedback: 「AI だけでは届かなかった」は公平でない。任せきったのは実質 1 日で、3 か月放っておいた結果ではない。話者が口を出さなかったらどうなったかは、誰も見ていない。無いなら「比べていません」と言ってほしい。
    thinking: そのとおり。言えるのは「人の経験が入ると速く、安く進む」まで。
    change: 冒頭に「比べていません」を置いた。3 周目で「承認なしは今も続いている。方向まで任せたのが 1 日」と正確にした。
    status: 反映
  - scene: enough
    round: speaker1
    from: 話者
    feedback: 「できたこと」が業務上十分なら、専門性は要らないことになる。私の主張は「そうではない」。競合に対して 1000 点差があるプロダクトは、市場に出す意味がない。
    thinking: 初版はこの主張を「100 回比べて 98 回負ける製品」として入れた。
    change: product-gap というシーンを作った（のちに、このシーンに統合）。
    status: 反映
  - scene: enough
    round: r2
    from: 4 人全員
    feedback: 3200 点は「人間が勝てない強さ」に近いのに、「市場に出す意味がない」と言われてもピンと来ない。4000 点は話者が自分で置いた線。比べる相手も公平でない。
    thinking: 「AI だけ＝3200 点」という前提が、記録からは言えない。言えるのは、公開されている知識で届くのが 3400 点までだったこと。
    change: 製品のたとえを「公開されている知識は競合も使える。差が付くのはその先」に変え、product-gap を消した。
    status: 反映
  - scene: enough
    round: r3
    from: 中村・小林・斎藤・高橋
    feedback: 「3400 点までは誰がやっても届く」は、「まとめて移す判断は経験から出た」と食い違う。同じ 200 点を、経験の手柄と「誰でも届く」の両方に数えている。
    thinking: 2 周目のあとに私が入れた枠組みの穴。誰でも手に入るのは知識で、結果ではない。
    change: 「知識は誰でも AI に使わせられる。差が付いたのは使い方と、知識が尽きた先」に直した。
    status: 反映
  - scene: enough
    round: speaker2
    from: 話者
    feedback: スタートアップのエンジニアの立場では、トップ以外はつらい。先行されている市場ではなおさらで、ひっくり返す材料にならない。問題は、AI だけの力でどこまで到達するのか。
    thinking: 立場を言えば、「競合と同じ所では足りない」が自分で置いた線の話でなくなる。
    change: 「私はスタートアップのエンジニアです。先行する競合がいる市場では、トップ以外はつらい」を足した。
    status: 反映
  - scene: someday
    round: r3
    from: 高橋（意図を確認済み）・小林
    feedback: 「その判断も、いずれ AI がやるのでは」。いちばん強く浮かんだのは enough の「AI が賢くなっても、線の先は残ります」。直前に「放っておいても AI はいつか見つけた」と聞いたばかりで、「残る」の根拠が無い。
    thinking: 話者の考えは「いずれ任せるようになると思う。時間軸の答えは持っていない。ただ簡単ではない。AI は何もしなければ平均点の答えを出しやすい。平均点が上がっても、先を走る人は残る。優位が縮まる速さも上がる」。高橋役は、これで 7 割収まると答えた。
    change: 疑問が浮かぶ enough の直後に、新しいシーンとして入れた。最後に「AI だけでどこまで届くのかは、私もまだ分からない」という開いた問いを置いた。
    status: 反映
  - scene: someday
    round: r3
    from: 高橋（意図を確認済み）
    feedback: まだ引っかかる所が 3 つ。「平均点の答え」が実験のどこで見えたのか。「先を走る人」は世界 9 位の話に聞こえ、中堅の居場所は狭くなるのでは。「発明する側にはつらい」は、結びの「経験の価値は下がっていない」とぶつかる。
    thinking: 1 つ目と 2 つ目は、話者の言葉でないと書けない。3 つ目は「積み直し続けることになる」でつないだ。
    change: 3 つ目だけ反映した。
    status: 話者待ち
  - scene: value
    round: r2
    from: 高橋・斎藤
    feedback: 「価値を見て次を絞ることは、AI にはできませんでした」は言い切りすぎ。いまのモデルの話で、根拠は 1 日。
    thinking: 言えるのは「この 3 か月、それは私の役目だった」まで。
    change: 「AI にはできなかった」を「この 3 か月、私の役目でした」に変えた。
    status: 反映
  - scene: release-judge
    round: speaker1
    from: 話者
    feedback: 「将棋には恵まれていた点があります」は違和感。判定を自動化できることを前提に題材を選んでいる。
    thinking: 恵まれていたのではなく、選んだ理由。
    change: 「将棋 AI を選んだ 1 つ目の理由を思い出してください」から入る形にした。
    status: 反映
  - scene: release-judge
    round: r1
    from: 高橋
    feedback: 「仕事では判定を自動化できません」と言い切られると引っかかる。テストや CI で自動にできる判定はある。
    thinking: 自動で確かめられるのは「壊れていないこと」まで。
    change: 「テストや CI で確かめられるのは、壊れていないことまで。価値が上がったかは自動では判定できない」にした。
    status: 反映
  - scene: release-judge
    round: r2
    from: 小林・高橋
    feedback: 判定したのが対局なのか話者なのか混乱した。「人の所で止まる」と「判定力を伸ばそう」がつながらない。伸びても止まるのは同じでは。
    thinking: 対局が教えるのは「強くなったか」だけ。「なぜ外れたか」「方向が合っているか」は話者が見分けていた。
    change: その区別を 1 状態足した。「見分けられる人のところでは速く通る。見分けられないと、止まるか、分からないまま通る」にした。言葉も「判定する」から「見分ける」に変えた。
    status: 反映
  - scene: delegable
    round: r2
    from: 4 人全員
    feedback: 「磨いてきたものだけ」と言い切った直後に「いまから身につけられる」と来る。演題と逆のことを言われた感じがする。
    thinking: 「磨いてきた」が済んだ話に聞こえるのが原因。
    change: 「この範囲は、いまからでも広げられます」という状態を足し、円が広がる絵にした。
    status: 反映
  - scene: delegable
    round: r3
    from: 高橋・中村
    feedback: 見分けられない新しい方式を任せている。対局が判定してくれたからだ。それなら条件は「見分けられる、または測れる」ではないか。
    thinking: そのとおりで、演題より正確な条件になる。仕事では機械が測ってくれる所が少ないので、結局「見分けられる範囲」に戻る。話者は、ここにもう少し補足が欲しいと言っている。
    change: 「良し悪しを機械が測ってくれるか、自分で見分けられるか、のどちらか。仕事では測ってくれる所は多くない」を足した。
    status: 話者待ち
  - scene: new-method
    round: speaker1
    from: 話者
    feedback: NNUE は題材に使えるかも。10 年前は KKP + KPP だけで、NNUE には手を出したことがない。実装コストがつらかったから。今回やってみると、試したいことがたくさんあって、すぐ試せる。
    thinking: 若手役の「それは経験を積めた世代だから言えること」への答えになる。話者自身が、この 3 か月で新しく見分けられるようになった例。
    change: 新しいシーンにした。技術の名前は出さず、「古い方式」「新しい方式」と呼んでいる。
    status: 反映
  - scene: new-method
    round: repo
    from: 記録との照合
    feedback: 8 月の後半、構造を変える案は 7 回続けて外れ、データを良くする案は 4 回続けて当たった。9/18 に、構造を凍結して学習に絞ると話者が決めている。
    thinking: 「作って比べた回数が、何に力を入れるかの判断になった」の実例になる。
    change: この経緯を話に足した。
    status: 反映
  - scene: new-method
    round: r2
    from: 斎藤
    feedback: 経験のうち「そのまま効いた部分」と「古くて作り直した部分」を分けて見せてほしい。自分の 15 年を棚卸しできる。
    thinking: そのまま効いたのは、まとめて移す判断のような全体の見当。古くて足りなかったのは、新しい方式の中身。
    change: その 2 つを並べて言う文を足した。3 周目で斎藤役は「不安への、初めて聞く答え方」と評価した。
    status: 反映
  - scene: new-method
    round: r2
    from: 4 人全員
    feedback: 10 年の土台がある人の話に聞こえる。土台がゼロの人が同じ 3 か月で同じ所に行けるのかは分からない。
    thinking: 「見分けられる所を足場にして、隣へ広げた」とは書いた。足場がゼロの人の最初の 1 周は、話者の材料が無いと書けない。
    change: 足場の説明だけ足した。
    status: 話者待ち
  - scene: build-many
    round: r1
    from: 高橋・中村
    feedback: 「やってみて、初めて分かることがあります」で終わる。何が分かったのかが出てこない。
    thinking: 私が埋めると作り話になる。
    change: 変えていない。話者は、会員サイトを細かく話すと聴衆の知るべきことが増えるので、題材を考えると言っている。
    status: 話者待ち
  - scene: build-many
    round: r2
    from: 4 人全員
    feedback: 自分で使って比べた結果が、好みではないとどう確かめるのか。将棋には対局という物差しがあったが、仕事には無い。画面の無い領域（設計やバックエンド）はどう比べるのか。
    thinking: 話者も「これは確かに」。納得して持ち帰れる形にしたい、とのこと。
    change: hands-on に「理由を 1 行残して、あとで結果と見比べる」を仮で置いた。ここは実例と一緒に決める。
    status: 話者待ち
  - scene: hands-on
    round: r1
    from: 中村
    feedback: 「手を動かすはコードを自分で書くことではありません」は、「昔自分で実装したから分かった」と食い違う。
    thinking: 「コードを書くことではない」は私が足した文で、話者の言葉ではなかった。
    change: その文を消し、「作って、使って、直して、比べる。最初は良し悪しが分からなくてかまわない」にした。
    status: 反映
  - scene: answer
    round: r1
    from: 中村・高橋
    feedback: 「良し悪しを自分で判定できる題材を 1 つ選んで」と言われても、それが無いのが悩み。堂々巡りに感じる。
    thinking: 企画シートの行動の文面のままだと、若手には出発点にならない。
    change: 「気になる題材を 1 つ選んで、AI に何パターンも作らせて、自分で使い比べる」に変えた。企画シートから変えているので、話者の確認が要る。
    status: 話者待ち
  - scene: answer
    round: r3
    from: 斎藤
    feedback: 経験を積むコストが下がるなら、若手はすぐ追いつける。積んできた側の希少さは下がる、とも聞こえる。同じ画面で「下がっていません」と言われると、励ましに聞こえて冷める。
    thinking: 話者の「優位が縮まる速さも上がっている」と同じ指摘。someday で正直に言ったので、ここは「古くなった所は安く積み直せる」までにとどめている。
    change: 「古くなった所は、安く積み直せます」を足した。ベテランに何が残るのかを、もう一歩言い切るかは話者と決めたい。
    status: 話者待ち
