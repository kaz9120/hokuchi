# この発表を読んでもらう聴衆役 (ADR-0039)。persona は personas/ のプリセットの id。
# why は「場」の文脈で、なぜこの発表を聞きに来たかを書く。
readers:
  - persona: mid-backend
    why: 自分で選んで来ている。同じ時間帯には、ADR や顧客との合意形成といった「チームで決める」話もある。いま知りたいのは、チームより先に「自分」のこと。手法の紹介ではなく、AI に任せきってみた人が何に突き当たったのかを聞きたい。
  - persona: junior-web
    why: 「ビギナー向け」のタグを頼りに、自分で選んだ。先輩世代が AI 時代の経験をどう見ているのか、自分は何を積めばいいのかのヒントが欲しい。
  - persona: veteran-lead
    why: 演題の「磨いてきたもの」に惹かれて、自分で選んだ。自分の経験の価値を確かめたい気持ちと、AI の使いこなしで若手に後れを取っている焦りが半々。
  - persona: student-cs
    why: 研究室の先輩に誘われて、初めてカンファレンスに来た。聞く発表は自分で選んだ。AI とキャリアの話なら、自分にも関係がありそうだと感じた。現場のエンジニアの本音を持ち帰りたい。
  - persona: eng-manager
    why: チームへの AI の入れ方を考える材料を探しに来た。任せきった人が何に突き当たったかを、チームに持ち帰りたい。
  - persona: ai-heavy-cto
    why: 演題を見て、自分たちのやり方の答え合わせになると思って来た。任せきった結果の実測に興味がある。
