id: 1
at: 2026-10-12T17:41:22.936Z
scenes: 32
states: 98
readers:
  - persona: mid-backend
    name: 高橋さん
    label: 中堅のバックエンドエンジニア（6 年目）
    scores:
      got:
        score: 4
        reason: 任せきった人が何に突き当たったか（6件連続不採用、採用率27%、意思決定は手放せていない）を具体的な数字で聞けた。
      trouble:
        score: 4
        reason: 「経験に価値はあるのか」「その判断もいずれAIがやるのでは」という自分の疑問がそのまま取り上げられていた。ただ「判断できる領域が思い当たらない」には直接の答えがなかった。
      insight:
        score: 4
        reason: 「任せられる範囲＝良し悪しを見分けられる範囲」「下がったのは経験を積むコスト」という見方は持っていなかった。
      follow:
        score: 4
        reason: 目盛りで3200→3400→3600→3800と整理してくれたので筋は追えた。学習データの採点の話と、後半の「新しい方式」の話は耳だけだと少しぼやけた。
      glance:
        score: 4
        reason: 見出し1文と目盛り・棒グラフ中心でほぼ読めた。設計記録の実物と改善9件の一覧は3秒では読めなかった。
      convinced:
        score: 3
        reason: 将棋での話には納得した。ただ話し手は10年の蓄積がある人で、方向までAIに任せた場合とも比べておらず、測れない実務にそのまま当てはまるかは半信半疑。
      action:
        score: 4
        reason: 「2案作らせて自分で決め、理由を1行残し、あとで結果と見比べる」は明日のタスクで試せる。ただ実務で何を「結果」と見比べるのかが分からない。
      recommend:
        score: 4
        reason: 手法紹介ではなく、届いていない・比べていないと正直に言う実験記録なので、同じ悩みの同僚には勧めたい。
    message: AIに任せられるのは自分が良し悪しを見分けられる範囲までなので経験の価値は下がっておらず、その見分ける力はAIで何度も作って比べることで今からでも安く積める、ということ。
    wish: 対局のような物差しがない普通のバックエンドの仕事で、「2案を比べたあと何の結果と見比べるのか」を、会員サイトの例でもいいので1つ最後まで見せてほしかった。
    notes:
      - scene: hands-on
        state: 3
        kind: good
        text: 2案作らせて選ぶ、理由を1行残す、あとで見比べる。小さくて具体的で、明日そのままやれる。理由を残すと「見分けられたのか、ただの好みか」が分かる、という説明も腑に落ちた。
      - scene: hands-on
        state: 3
        kind: unconvinced
        text: 「あとで結果と見比べる」の結果が、将棋では対局の点数だった。自分の仕事（APIの設計やリファクタ）では何が結果に当たるのかが分からず、そこで手が止まりそう。
      - scene: build-many
        state: 2
        kind: unconvinced
        text: 会員サイトを作って自分で使えば迷う所は分かる、は分かる。でもそれは自分の感想で、価値が上がったかどうかとは別では。将棋と違って答え合わせがないまま「見分けられるようになった」と言えるのかが引っかかった。
      - scene: reading-adr
        state: 3
        kind: good
        text: AIは「離れる」、自分は「まとめて移す」と逆の判断をした場面。同じ記録を読んで結論が分かれた所に経験が出ている、というのがいちばん具体的に伝わった。
      - scene: not-gacha
        state: 1
        kind: good
        text: 方向まで任せたのは実質1日で、3か月任せた場合とは比べていない、と先に言ってくれた。ここで話全体を信用できた。
      - scene: not-gacha
        state: 3
        kind: unconvinced
        text: 比べていないと言った直後に「人の経験が入ると速く安く進むことは分かっている」と言い切るのは少し強く感じた。3日で200点は事実でも、AIだけの場合の数字がない。
      - scene: delegable
        state: 2
        kind: unconvinced
        text: 話し手には10年の将棋AIがあった。自分には「ここなら見分けられる」と言える領域が思い当たらない。6年分のバックエンドの経験のどこが小さい円に当たるのか、見つけ方の話がほしかった。
      - scene: someday
        state: 2
        kind: unconvinced
        text: 「平均点のような丸まった答えを出しやすい」「誰もが自由に使える形になるかは疑問」は話し手の見立てで、根拠が聞き取れなかった。分からないと認めてくれたのは良かったが、不安は残った。
      - scene: release-judge
        state: 4
        kind: good
        text: 手法を入れても仕事が変わらないのは、見分ける人のところが変わらないから、という説明。新しい手法を試しても成果が変わらない自分の実感と合った。
      - scene: my-calls
        state: 2
        kind: word
        text: 「学習データの採点を、もっと強いソフトにやり直してもらう」は一度聞いただけではつかみきれなかった。75点伸びたいちばんの当たり、という所だけ残った。
      - scene: new-method
        state: 2
        kind: jump
        text: 「新しい方式」が何を指すのか分からないまま話が進んだ。10年やっていた人でも手を出せなかった所を今回積み直せた、という趣旨は伝わったが、中身は追えていない。
      - scene: new-method
        state: 4
        kind: unreadable
        text: 改善9件の一覧（日付と点数）は読み切れなかった。「9件採用された」だけ分かれば足りるので、数字1つで見せてくれたほうが楽。
  - persona: junior-web
    name: 中村さん
    label: 若手の Web エンジニア（新卒 2 年目）
    scores:
      got:
        score: 4
        reason: 先輩世代が経験をどう見ているかと、自分が何を積めばいいかの具体案（2案作らせて選ぶ）は持ち帰れた。ただ仕事のタスクにどう当てはめるかは自分で考える必要が残った。
      trouble:
        score: 3
        reason: 「これから積む人」への言及はあったが、AIの出力をそのまま通してしまう・レビュー指摘が腹落ちしない、という自分の悩みそのものは直接は出てこなかった。
      insight:
        score: 4
        reason: 「下がったのは経験の価値ではなく、積むコスト」「任せられるのは良し悪しを見分けられる範囲」という見方は新しかった。
      follow:
        score: 4
        reason: 将棋を知らなくても目盛りの点数で流れは追えた。someday のあたりと、採点方式の話は少し置いていかれた。
      glance:
        score: 4
        reason: 見出しが1文で、目盛りや棒グラフも数字が少なく読めた。設計の記録の実物と改善一覧9件は読み切れなかった。
      convinced:
        score: 3
        reason: 将棋の話は納得したが、10年の経験がある人の成功例なので、土台のない自分にも同じように効くのかは半信半疑のまま。話者自身も方向まで任せた場合と比べていないと言っていた。
      action:
        score: 4
        reason: 次にAIに作らせるとき2案出させて、選んだ理由を1行残す、はすぐ試せる。あとで結果と見比べる、の「結果」が自分の仕事だと何になるかは分からない。
      recommend:
        score: 4
        reason: 同期には勧めたい。説教っぽくなく、分からないことを分からないと言ってくれるので聞きやすかった。ただ前半の将棋の記録が長く、若手向けの話は最後の数分だけだった。
    message: AIに任せられるのは自分が良し悪しを見分けられる範囲までで、その見分ける力は、AIに何パターンも作らせて自分で比べることで、いまからでも前より速く積める、ということ。
    wish: 最後の「2案作らせて選ぶ」を、会員サイトの試作や将棋ではなく、普段の実装タスクやレビューの場面（数字で結果が出ない、経験の足場もない若手の場合）でやるとどうなるかの例が1つ欲しかった。
    notes:
      - scene: hands-on
        state: 3
        kind: good
        text: 2案作らせて自分で決める、理由を1行残す、あとで見比べる。ここがいちばん具体的で、明日からやれると思えた。
      - scene: hands-on
        state: 3
        kind: unconvinced
        text: 「あとで結果と見比べる」の結果が、将棋なら対局だけど、自分の普段のタスクだと何と見比べればいいのか分からなかった。レビューの指摘なのか、リリース後の反応なのか。
      - scene: new-method
        state: 3
        kind: unconvinced
        text: 「見分けられる所を足場にして隣へ広げた」は、10年の足場がある人の話に聞こえた。足場がまだほとんどない自分は、どこから広げればいいのか。
      - scene: answer
        state: 3
        kind: good
        text: 「下がったのは経験を積むためのコスト」は、経験の機会をAIに吸い取られていると感じていた自分には逆の見方で、少し気が楽になった。
      - scene: beginner
        state: 3
        kind: good
        text: オンライン講座が苦手で、磨いてきたものがない、と話者自身が初心者の立場に立ってくれたので、ここから自分ごととして聞けた。
      - scene: build-many
        state: 2
        kind: unconvinced
        text: 仕事の片手間に会員サイトをかなりの数作る、というのは EM だからできる気もした。チケットに追われている自分に、その時間と題材をどう作るのかは触れられていなかった。
      - scene: release-judge
        state: 4
        kind: good
        text: 「見分けられないと、良し悪しが分からないまま通ってしまう」は、AIの出力をそのまま通している自分のことだと思って刺さった。
      - scene: delegable
        state: 2
        kind: good
        text: 大きい円の中に小さい円の図は一瞬で分かった。演題の意味がここでつながった。
      - scene: someday
        state: 3
        kind: jump
        text: 優位が縮まる、発明する側にはつらい、積み直し続ける、と話が次々に進んで、結局何が言いたいのか耳だけでは追い切れなかった。
      - scene: my-calls
        state: 2
        kind: word
        text: 「学習データの採点をもっと強いソフトにやり直してもらう」は説明を聞いても何をしているのかぼんやりしたまま。75点伸びた、だけ受け取った。
      - scene: reading-adr
        state: 1
        kind: unreadable
        text: 設計の記録の実物は文字が細かくて3秒では何も読めなかった。雰囲気だけ。ADR という言葉も setup で一度聞いただけなので、ここで少し思い出すのに時間がかかった。
      - scene: enough
        state: 3
        kind: jump
        text: 急にスタートアップと競合の話になって、自分にはあまり関係のない話に感じた。事業の話はなじみが薄い。
  - persona: veteran-lead
    name: 斎藤さん
    label: ベテランのテックリード（15 年目）
    scores:
      got:
        score: 4
