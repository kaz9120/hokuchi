      - scene: reading-adr
        state: 3
        kind: good
        text: AI が「離れる」と結論した所で、昔自分で実装した経験から「まとめて移す」と逆の判断をした場面。経験が効く瞬間が具体的で、自分のレビューでの違和感と重なった。
      - scene: hands-on
        state: 3
        kind: good
        text: 理由を 1 行残してあとで結果と見比べれば、見分け方が合っていたのか好みだったのかが分かる、という話。「好みの問題では」に言い返せない自分への、初めての実用的な手がかりだった。
      - scene: not-gacha
        state: 1
        kind: unconvinced
        text: 方向まで任せたのは実質 1 日で比較はしていない、とのこと。正直さは買うが、「人の経験が入ると速く安く進む」は対照のない見立てに聞こえた。
      - scene: new-method
        state: 5
        kind: good
        text: そのまま効いたのは全体の見当を付ける所で、古かったのは新方式の中身、という切り分け。自分の経験は古い種類では、という不安にそのまま答えていた。労力が 10 分の 1 という話も、体力の悩みに響いた。
      - scene: beginner
        state: 3
        kind: unconvinced
        text: 数字で測れない仕事の話が、話し手自身も経験のない領域の例だった。経験のある人が数字の出ない場で違和感をどう通すのか、という自分の知りたい場面にはならなかった。
      - scene: release-judge
        state: 4
        kind: unconvinced
        text: 成果は見分ける人のところで決まる、は筋として分かる。ただ、うちの若手が実際に速く成果を出しているのは、見分けられているのか、分からないまま通っているのか、判断材料がなかった。
      - scene: enough
        state: 2
        kind: good
        text: 知識は誰でも手に入るが、差が付いたのはどう使うかの見当、という整理。6 件外れと 3 日で届いた対比があるので、腹に落ちた。
      - scene: build-many
        state: 3
        kind: unconvinced
        text: 自分で使い比べて違いが見える、というのは自分の感覚の範囲の話に聞こえた。それが利用者にとっての価値と合っているかをどう確かめるのかが、語られなかった。
      - scene: my-calls
        state: 2
        kind: word
        text: 「学習データの採点をやり直してもらう」は、説明を 1 度聞いただけでは何をしたのか掴みきれなかった。75 点伸びた、という結果だけ持ち帰った。
      - scene: reading-adr
        state: 1
        kind: unreadable
        text: 設計の記録の実物は、数秒では中身を読めなかった。こういうものを読んでいる、という雰囲気だけ受け取った。
      - scene: someday
        state: 3
        kind: jump
        text: 「積んだものは積み直し続けることになる」「発明する側にはつらい時代」と、直後の「AI だけで簡単に勝てる時代にはなりにくい」のつながりが、耳では追いきれなかった。
      - scene: result
        state: 4
        kind: good
        text: 4000 点には届いていない、3800 点も AI が自分で届いた数字ではない、と先に言い切った所。成功談の自慢ではないと分かり、ここから身を入れて聞けた。
