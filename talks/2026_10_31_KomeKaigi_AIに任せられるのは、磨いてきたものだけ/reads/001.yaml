    message: AI に任せられるのは出てきたものの良し悪しを自分で見分けられる範囲までで、経験の価値は下がっておらず、下がったのは経験を積み直すコストのほうだ、ということ。
    wish: 結果が数字で出ない業務の設計判断で、経験からくる違和感が「好み」ではないとどう確かめるのかを、会員サイトの話の中で実例 1 つとして見せてほしかった。
