      insight:
        score: 4
        reason: 「下がったのは経験を積むコスト」と「同じ公開知識でも使い方で結果が分かれた」は、分かっていたつもりの話に新しい切り口をくれた。
      follow:
        score: 4
        reason: 二重の問いの枠と点数の目盛りで最後まで追えたが、将棋 AI の学習や採点の話は雰囲気で聞いた所がある。
      glance:
        score: 4
