        score: 3
        reason: 大半はひと目で読めたが、先読みの部品 4 つやグラフの印 3 か所は、3 秒では読み切れなかった。
      convinced:
        score: 3
        reason: 将棋の話には納得した。ただ、仕事への置き換えは例え話の段階で、「その判断もいずれ AI がやるのでは」には答えていなかった。
      action:
        score: 3
        reason: 手間が大きくて避けてきた技術を AI と試す、というのはできそう。でも、どれを選ぶかはまだ決められない。
      recommend:
        score: 4
        reason: 手法の紹介ではなく、任せきった結果として測った数字があるので、同じ悩みを持つ同僚に勧められる。
    message: AI に任せるほど差は止まったあとの判断で付き、その判断の基準は、自分の問いで手を動かして磨いた専門性と個性から出てくる。
    wish: 自分は 10 年続けた専門分野を持っていないので、6 年目くらいの人が、自分の判断できる領域をどう見つければいいのかを、話し手の若い頃の経験などから 1 つ示してほしかった。
    notes:
      - scene: result
        state: 5
        kind: good
        text: 3200 点から 4000 点までの 800 点が人の分だと、帯で見せてくれたのがいちばん刺さった。AI だけでは止まると数字で分かった。
      - scene: same-ai
        state: 2
        kind: good
        text: 誰でも同じ AI を使うので止まる所も同じ、という話で、手法を追いかけても成果が変わらない理由に納得がいった。
      - scene: in-your-work
        state: 0
        kind: unconvinced
        text: 3 つの例が、話し手が仕事で実際に経験したことではなく一般論に聞こえた。将棋ほどの説得力がなかった。
      - scene: knowledge
        state: 2
        kind: unconvinced
        text: AI も知識は持っているなら、場面で使う判断も、いずれ AI ができるようになるのでは。その疑問が残った。
      - scene: expertise
        state: 4
        kind: good
        text: 積んできた専門性を足場にすると、隣の分野を 10 分の 1 の労力で積めるという話は、自分の 6 年にも希望が持てた。
      - scene: not-ai-alone
        state: 1
        kind: good
        text: AI が何回試しても、結果を受け止める人がいなければ基準は育たない。毎日任せきりにしている自分には耳が痛かった。
      - scene: six-losses
        state: 2
        kind: unreadable
        text: 中央の先読みと、部品 4 つの長い説明を 3 秒で読むのは無理だった。「組で動く」ことだけ分かれば足りると思う。
      - scene: result
        state: 5
        kind: unreadable
        text: 線の上の印 3 か所は小さくて、読む前に話が進んだ。「8 月 学習データ」は、後半まで何のことか分からなかった。
      - scene: stride16
        state: 3
        kind: good
        text: 1 列を 16 升にしたら割り算が要らなくなる、という一言が効いた話は、経験が判断に効く具体例として分かりやすかった。
      - scene: why-restart
        state: 3
        kind: good
        text: 仕事では作ったものの価値が測れないので、手法の良し悪しも測れない。普段のもやもやを言葉にしてもらえた。
      - scene: source
        state: 2
        kind: jump
        text: 判断の基準の話から、急に「専門性と個性」が出てきて、個性がなぜ並ぶのかが一瞬つながらなかった。
      - scene: goal
        state: 1
        kind: good
        text: 200 点差で 4 回に 3 回勝つ、という説明があったので、点数の差をそのあとも実感しながら聞けた。
