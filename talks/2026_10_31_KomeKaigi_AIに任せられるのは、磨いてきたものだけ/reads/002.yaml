        score: 4
        reason: 同じ AI は同じ所で止まり、差はそのあとで付くという見方は、自分になかった。
      follow:
        score: 4
        reason: 左下に現在地が出ていて、将棋の中身が分からなくても「AI が止まった所と人が足したもの」を追えば迷わなかった。
