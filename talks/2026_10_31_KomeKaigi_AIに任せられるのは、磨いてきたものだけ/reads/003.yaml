readers:
  - persona: mid-backend
    name: 高橋さん
    label: 中堅のバックエンドエンジニア（6 年目）
    scores:
      got:
        score: 4
        reason: AI に任せきった人が「3200 点前後で止まった」という具体的な壁と、そこで人が足したものが聞けて、来た目的には合っていた
      trouble:
        score: 4
        reason: 「積んできた経験に価値はあるか」をそのまま問いに立てていて、自分の悩みの中心に触れていた
      insight:
        score: 4
        reason: 差は知識の有無ではなく「その場面で使うと判断できるか」だという切り分けと、AI は書き直しの大きい案を外しがちだという指摘が新しかった
      follow:
        score: 4
        reason: 左下の現在地表示と 7 月・10 月の 2 場面に絞った構成で、将棋を知らなくても追えた。ただ後半の専門性と個性の話で軸が少し変わった
      glance:
        score: 3
        reason: 多くは見出し 1 行でつかめたが、先読みの部品 4 つの図や盤の図は、3 秒では文字を読み切れなかった
      convinced:
        score: 3
        reason: 将棋の 2 場面は納得できた。ただ、10 年作ってきた人だから判断できた話にも聞こえ、6 年目の自分にも同じ判断の種があるとは言い切れなかった
      action:
        score: 2
        reason: 「好きなことを本気でやる」は正しいと思うが広すぎて、明日どの場面で何をすればいいかには落ちなかった
      recommend:
        score: 4
        reason: 手法紹介ではなく、任せきった結果の壁を数字で見せてくれるので、同じ悩みを持つ同僚に勧めたい
    message: AI に任せるほど、AI が止まる「決め方が問われる所」で差が付き、その決め方は自分で作って結果を受け止めた経験からしか出てこないので、経験の価値は下がっていない。
    wish: in-your-work の仕事への置き換えのあとに、10 年の専門分野を持たない 6 年目のエンジニアが、いまの実務のどこで「AI が止まった所」に気づき、決め方を磨けばいいのかを具体例で 1 つ示してほしかった。
    notes:
      - scene: knowledge
        state: 2
        kind: good
        text: 「AI も知識としては知っていた、差は使うと判断できたか」で、AI の出力を判定できない自分のもやもやに名前が付いた
      - scene: result
        state: 4
        kind: good
        text: AI だけでは 3200 点前後で止まったと正直に出していて、任せきった人の話として信用できた
      - scene: try-mailbox
        state: 4
        kind: good
        text: AI は書き直しが大きい案を手作業時代の常識で外すが、人は逆に判断した、という対比が実務にもそのまま効く
      - scene: in-your-work
        state: 0
        kind: good
        text: 一部だけ移す、素直なコードが本番で遅い、の 2 例は自分の現場でも見覚えがあった
      - scene: practice
        state: 0
        kind: unconvinced
        text: 「好きなことをたくさんやる」はそれまでの具体的な話に比べて急に抽象的になり、明日の行動につながらなかった
      - scene: ai-stops
        state: 3
        kind: unconvinced
        text: 決め方が経験から出るのは分かる。でも、その決め方もいずれ AI ができるようになるのでは、という疑問には触れていなかった
      - scene: stride16
        state: 3
        kind: unconvinced
        text: 16 升の一言は 10 年作ってきた人だから出たもので、自分には同じ深さで判断できる領域が思い当たらない
      - scene: individuality
        state: 0
        kind: jump
        text: 「決め方」の話から「個性」へ移ったとき、個性が決め方とどうつながるのかが見えず、話が一段飛んだ感じがした
      - scene: expertise
        state: 3
        kind: word
        text: NNUE と Word2Vec の説明がなく、例としての意味が取れなかった
      - scene: six-losses
        state: 2
        kind: unreadable
        text: 部品 4 つの説明文がそれぞれ長く、3 秒では読み切れなかった
      - scene: why-restart
        state: 0
        kind: good
        text: 仕事では手法の良し悪しを測れないから将棋で確かめる、という理由づけで、「数字で測れる題材だから言えた」という引っかかりが先回りして解かれた
      - scene: goal
        state: 1
        kind: word
        text: floodgate の点数の仕組みは 1 度聞いただけでは追いきれなかったが、200 点差で 4 回に 3 回勝つという換算があって助かった
  - persona: junior-web
    name: 中村さん
    label: 若手の Web エンジニア（新卒 2 年目）
    scores:
      got:
        score: 3
        reason: 先輩世代が経験をどう見ているかは分かったが、2年目の自分が仕事の中で何を積めばいいかは「好きなことをやる」以上の具体策がなかった。
