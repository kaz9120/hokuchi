        kind: unconvinced
        text: 判断できたのは自分で作って結果を見てきたから、と言われると、一から書いた経験が少ない自分はどうすればいいのかが残る。いちばん聞きたかった所だった。
      - scene: baseline
        state: 2
        kind: unconvinced
        text: 10年前の私が見たら絶望していた、の気持ちはいまの自分に近い。でも、話し手はそこから10年分の蓄えで抜け出しているので、自分には当てはまらない気がした。
      - scene: practice
        state: 3
        kind: unconvinced
        text: 取り掛かるコストは言い訳にならない、と言われても、悩みは時間と題材がないことなので、行動力の話で片付けられた感じがした。
      - scene: not-ai-alone
        state: 2
