      action:
        score: 4
        reason: 次にレビューで遅いと言われたら、なぜ遅いのかを自分で測ってみようと思う。
      recommend:
        score: 3
        reason: 将棋AIの話は面白いので勧めたいが、同期が「結局ベテランの話」と受け取りそうで迷う。
    message: AIに任せる範囲が広がるほど、AIが止まった所で何を良しとするかを決められる人の経験で差が付くので、好きなことを本気でやって自分で結果を受け止め、専門性と個性を磨き続けよう、ということ。
    wish: 経験がほとんどない人がいま一から始めるなら、どんな題材でどう輪を回せば「決め方」が身につくのかを、仕事の中の具体例と一緒に1場面でいいから見せてほしかった。
