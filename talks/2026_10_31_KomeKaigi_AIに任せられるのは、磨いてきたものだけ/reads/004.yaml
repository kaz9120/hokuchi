readers:
  - persona: mid-backend
    name: 高橋さん
    label: 中堅のバックエンドエンジニア（6 年目）
    scores:
      got:
        score: 4
        reason: AIに任せきった人が3200点前後で止まり、その先は人が決め直して伸ばしたという話で、聞きたかった「突き当たった所」を聞けた。
      trouble:
        score: 4
        reason: 「積んできたものに価値はあるか」という問いがそのまま扱われていた。一方で、AIの出力の良し悪しを判定できない不安は、10年の蓄積がある人の側からの答えに留まっていた。
      insight:
        score: 4
        reason: AIは知識を持っていても、その場面で使う判断はできない。AIは書き直しの大きい案を外しがちで、そこを試すかは人が決める。この2つは、自分では言葉にできていなかった。
      follow:
        score: 4
        reason: 左下の現在地表示と7月・10月の2場面に絞った構成のおかげで、将棋に詳しくなくても最後まで追えた。後半の専門性と個性の段で、少し話が広がった。
      glance:
        score: 4
        reason: 見出しが話の結論になっていて読みやすかった。結果のグラフと、10年前の私のプログラムの図は、3秒では要素を拾い切れなかった。
      convinced:
        score: 3
        reason: 判断が経験から出るという話には納得した。ただ、800点が人のおかげかは比べていないと本人も言っており、測れない実務で同じことが起きるかは確かめられていない。
      action:
        score: 4
        reason: AIのコードが遅いと言われたら、自分で測って原因を確かめる。小さいので明日からできる。
      recommend:
        score: 4
        reason: 手が速くなったのに専門が分からない同僚には、手法紹介より響くと思う。
    message: AIだけで届く所には誰でも届き、その先で差を付けるのは、自分で作って結果を受け止めてきた経験から出る「決め方」である。
    wish: 話し手には10年の将棋AIという深い領域があったが、そういう領域を持たない6年目のバックエンドエンジニアが、業務の中で自分の判断が効く領域をどう見つけ、どう育てるか。その具体例が1つあれば、自分の話として持ち帰れた。
    notes:
      - scene: knowledge
        state: 2
        kind: good
        text: 差が付いたのは知識の有無ではなく、その場面で使うと判断できたか。この言い方で、AIの出力に自信が持てない理由が少し腑に落ちた。
      - scene: in-your-work
        state: 0
        kind: good
        text: 認証やキャッシュを一部だけ移す例、素直なコードが本番のデータ量で遅い例は、どちらも日々の業務そのままで、置き換えが効いた。
      - scene: in-your-work
        state: 3
        kind: good
        text: AIは手で作る時代の常識のまま、書き直しの大きい案を外しがちだという指摘は、自分の使い方を見直すきっかけになった。
      - scene: same-ai
        state: 3
        kind: unconvinced
        text: AIだけで続けた場合と比べていないと自分で認めたうえでの800点なので、差が付くのは止まったあとだという主張の根拠としては弱く感じた。
      - scene: knowledge
        state: 3
        kind: unconvinced
        text: 判断できたのは自分で作ってきたからだという話は、10年の蓄積があってのこと。自分には判断できる領域が思い当たらないので、そこへの橋がほしかった。
      - scene: baseline
        state: 3
        kind: unconvinced
        text: どの分野でもAIで10年前の最先端が作れるという一般化は、将棋のように測れる題材の話からは飛躍に聞こえた。
      - scene: expertise
        state: 1
        kind: jump
        text: 決め方の話から「強くする方法を100個挙げられるか」という引き出しの数の話に移ったところで、判断の話とのつながりを見失った。
      - scene: individuality
        state: 3
        kind: word
        text: Bonanzaメソッドと方策勾配法が分からず、何が主流から外れた選択だったのかを掴めなかった。
      - scene: result
        state: 5
        kind: good
        text: 手を動かしたのは最後までAIで、どこを掘るかを決め直したのは人だった。この対比で、この話がどこへ向かうのかがはっきりした。
      - scene: six-losses
        state: 4
        kind: good
        text: コードを読まなくても、設計の記録から6件の不採用を同じ原因で説明できたという話は、仕事でAIに任せるときの記録の価値として持ち帰れる。
      - scene: result
        state: 2
        kind: unreadable
        text: グラフに点、日付、点数、4000点の線が一度に出て、3秒では10月の2つの点の意味まで読み切れなかった。
      - scene: individuality
        state: 4
        kind: unconvinced
        text: 配列盤は「やってみたい気持ち」で選んだと言うが、その前の場面では経験からの判断として語られていて、どちらが本筋なのか少し混乱した。
  - persona: junior-web
    name: 中村さん
    label: 若手の Web エンジニア（新卒 2 年目）
