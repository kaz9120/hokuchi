# カバレッジデッキ — レンダラ改善の検証台。
# 全 role (opener/title/transition/content/closer)、全レイアウトパターン、
# 要素 15 種 (statement/bullets/image/diagram/chart/quote/raw/code/post/link/
# stat/table/versus/agenda/video)、chart intent の composition (単一系列
# ドーナツ・複数系列 100% 積み上げ)、diagram flow.timeline、ブランド枠
# (ロゴ・フッタ・背景・反転前景) を 1 デッキで踏む (ADR-0016)。
# レンダラを変えたら、まずこのデッキを render / shot して全種の見た目を確認する。
schema_version: "0.3.0"
deck:
  title: "カバレッジデッキ — 全種の見た目検証"
  audience:
    who: "レンダラを変更する開発者 (人間と Claude)"
    action: "変更のたびにこのデッキを描画し、全種のリグレッションを目で確認する"
  scales:
    shared-y:
      y: { min: 0, max: 100 }
  theme: ../../themes/mosh.yaml

slides:
  - id: opener
    role: opener
    idea: "バンパー: レターボックスなし + bumper 背景 + ロゴ"
    layout: statement-stage
    elements:
      - kind: statement
        slot: statement
        text: "全種を、1 周する"
        emphasis: ["全種"]
    notes: |
      検証点: hero サイズ、bumper 背景 (bg-cover)、ロゴとフッタの位置。

  - id: title
    role: title
    idea: "タイトル: title-stage の主従とアクセントバー"
    layout: title-stage
    elements:
      - kind: statement
        slot: title
        text: "カバレッジデッキ"
      - kind: statement
        slot: subtitle
        text: "レンダラ改善の検証台 — 全 role・全パターン・全要素"
    notes: |
      検証点: title/subtitle のタイプスケール、アクセントバー色、title 背景。

  - id: profile
    role: content
    idea: "profile-stage: 自己紹介の定型 (丸抜き写真 + ラベル付き bio)"
    layout: profile-stage
    elements:
      - kind: image
        slot: portrait
        src: ./assets/sample-photo.svg
        prompt: "プロフィール写真のサンプル"
      - kind: statement
        slot: name
        text: "架空 太郎｜検証用のプロフィール"
      - kind: statement
        slot: affiliation
        text: "hokuchi 検証チーム"
      - kind: statement
        slot: handle
        text: "@example"
        icon: "x-logo"
      - kind: bullets
        slot: bio
        items:
          - "略歴 ── レンダラ検証のための架空の経歴。長めの行の折り返しもここで確認する"
          - "実績 ── カバレッジデッキ 14 枚を毎リリースで描画"
          - "趣味 ── スロット制、タイプスケール、文節改行"
    notes: |
      検証点: 丸抜き写真、ラベル (highlight 色) と本文の階層、
      slideument lint が profile-stage を対象外にすること。

  - id: transition-inverted
    role: transition
    idea: "転換: 濃色背景 (foreground: light) で前景が白系に反転する"
    layout: statement-stage
    elements:
      - kind: statement
        slot: statement
        text: "ここから、見た目の話"
        emphasis: ["見た目"]
    notes: |
      検証点: 反転前景 (文字が白、emphasis も白)、白版ロゴへの切り替え。

  - id: statement
    role: content
    idea: "statement: big サイズと emphasis の強調色"
    layout: statement-stage
    elements:
      - kind: statement
        slot: statement
        text: "1 枚に、1 アイデアだけ置く"
        emphasis: ["1 アイデア"]
    notes: |
      検証点: big サイズ、ハイライト色、BudouX 文節折り返し。

  - id: quote
    role: content
    idea: "quote: 引用符・本文・出典の 3 点構成"
    layout: quote-stage
    elements:
      - kind: quote
        slot: quote
        text: "データスライドが伝えるべきは、データそのものではなく、データの意味です。"
        attribution: "ナンシー・デュアルテ『slide:ology』"
    notes: |
      検証点: 引用マークの位置、出典の右寄せ、行末孤立文字がないこと。

  - id: diagram-cycle
    role: content
    idea: "diagram flow.cycle: 環状配置とエッジラベル"
    layout: diagram-stage
    elements:
      - kind: statement
        slot: headline
        text: "循環 (flow.cycle) の検証"
      - kind: diagram
        slot: diagram
        form: flow.cycle
        nodes:
          - { id: write, label: "書く", detail: "意図を YAML に" }
          - { id: render, label: "描画する", detail: "配置は導出" }
          - { id: check, label: "目で見る" }
        edges:
          - write -> render
          - render -> check
          - { from: check, to: write, label: "次の周へ" }
        emphasis: [check]
    notes: |
      検証点: 環状レイアウト (カード型)、detail 有り/無しの混在、曲線エッジ、
      エッジラベル、強調ノードの視覚差。

  - id: diagram-linear
    role: content
    idea: "diagram flow.linear: 直列配置の等間隔と矢印"
    layout: diagram-stage
    elements:
      - kind: statement
        slot: headline
        text: "直列 (flow.linear) の検証"
      - kind: diagram
        slot: diagram
        form: flow.linear
        nodes:
          - { id: a, label: "宣言", detail: "deck.yaml に意図を書く", icon: "pencil-simple-line" }
          - { id: b, label: "導出", detail: "render が配置を決める", icon: "flow-arrow" }
          - { id: c, label: "検証", detail: "lint と目視", icon: "magnifying-glass" }
          - { id: d, label: "凍結", detail: "final/ にコミット", icon: "snowflake" }
        edges: [a -> b, b -> c, c -> d]
        emphasis: [d]
    notes: |
      検証点: 横一列の等間隔、ノード幅のラベル追従、末尾ノードの強調、
      detail (補足 1 行) と icon (ADR-0013) 付きカード。強調ノードの
      アイコンはウェイトが 1 段階昇格する (regular → fill)。

  - id: diagram-layer
    role: content
    idea: "diagram structure.layer: 積層の帯"
    layout: diagram-stage
    elements:
      - kind: statement
        slot: headline
        text: "積層 (structure.layer) の検証"
      - kind: diagram
        slot: diagram
        form: structure.layer
        nodes:
          - { id: talk, label: "発表", detail: "final/ に凍結" }
          - { id: deck, label: "deck.yaml", detail: "意図の宣言" }
          - { id: render, label: "レンダラ", detail: "配置を導出" }
          - { id: schema, label: "スキーマ", detail: "正しさの床" }
        emphasis: [render]
    notes: |
      検証点: 帯の等幅・等間隔・宣言順 (上から下)、強調帯の視覚差。
      edges は描かれない (隣接が意味を持つ form)。

  - id: diagram-matrix
    role: content
    idea: "diagram structure.matrix: 2×2 の四象限"
    layout: diagram-stage
    elements:
      - kind: statement
        slot: headline
        text: "四象限 (structure.matrix) の検証"
      - kind: diagram
        slot: diagram
        form: structure.matrix
        nodes:
          - { id: a, label: "意図 × 導出", detail: "このツール" }
          - { id: b, label: "意図 × 手作業", detail: "デザイナー" }
          - { id: c, label: "見た目 × 導出", detail: "Marp" }
          - { id: d, label: "見た目 × 手作業", detail: "PowerPoint" }
        emphasis: [a]
    notes: |
      検証点: 2×2 グリッドの整列、カード等寸、強調セル。

  - id: diagram-branch
    role: content
    idea: "diagram flow.branch: 1 → 3 の分岐"
    layout: diagram-stage
    elements:
      - kind: statement
        slot: headline
        text: "分岐 (flow.branch) の検証"
      - kind: diagram
        slot: diagram
        form: flow.branch
        nodes:
          - { id: lint, label: "lint", icon: "magnifying-glass" }
          - { id: ok, label: "指摘なし", detail: "render へ", icon: "check" }
          - { id: warn, label: "警告", detail: "レポートに残る", icon: "warning" }
          - { id: err, label: "エラー", detail: "render を止める", icon: "x-circle" }
        edges: [lint -> ok, lint -> warn, lint -> err]
        emphasis: [err]
    notes: |
      検証点: 分岐元の縦中央、分岐先 3 枚の縦積み、斜め矢印、アイコン付きカード。

  - id: diagram-converge
    role: content
    idea: "diagram flow.converge: 3 → 1 の合流"
    layout: diagram-stage
    elements:
      - kind: statement
        slot: headline
        text: "合流 (flow.converge) の検証"
      - kind: diagram
        slot: diagram
        form: flow.converge
        nodes:
          - { id: brand, label: "BRAND.md" }
          - { id: tokens, label: "tokens.css" }
          - { id: spec, label: "SPEC" }
          - { id: theme, label: "テーマ", detail: "スロットに固定" }
        edges: [brand -> theme, tokens -> theme, spec -> theme]
        emphasis: [theme]
    notes: |
      検証点: 合流先の縦中央、合流元 3 枚の縦積み、矢印の集約。

  - id: diagram-tree
    role: content
    idea: "diagram structure.tree: 深さ 3 の階層"
    layout: diagram-stage
    elements:
      - kind: statement
        slot: headline
        text: "階層 (structure.tree) の検証"
      - kind: diagram
        slot: diagram
        form: structure.tree
        nodes:
          - { id: root, label: "hokuchi" }
          - { id: talks, label: "talks/" }
          - { id: tools, label: "tools/" }
          - { id: adr, label: "docs/adr/" }
          - { id: slides, label: "slides/", detail: "レンダラ本体" }
        edges: [root -> talks, root -> tools, root -> adr, tools -> slides]
        emphasis: [slides]
    notes: |
      検証点: 深さでカラムが決まる (0/1/2 の 3 列)、列内の宣言順、孫への矢印。

  - id: diagram-overlap
    role: content
    idea: "diagram cluster.overlap: 3 円のベン図"
    layout: diagram-stage
    elements:
      - kind: statement
        slot: headline
        text: "重なり (cluster.overlap) の検証"
      - kind: diagram
        slot: diagram
        form: cluster.overlap
        nodes:
          - { id: human, label: "人間", detail: "レビュー" }
          - { id: claude, label: "Claude", detail: "生成" }
          - { id: render, label: "レンダラ", detail: "配置" }
        shared: { label: "1 枚の合意", emphasis: true }
    notes: |
      検証点: 3 円の正三角形配置、外向きに逃げたラベル、共通部分の塗りと
      ラベル (shared、ADR-0015)。

  - id: diagram-enclosed
    role: content
    idea: "diagram cluster.enclosed: 枠と 3 つの中身"
    layout: diagram-stage
    elements:
      - kind: statement
        slot: headline
        text: "包含 (cluster.enclosed) の検証"
      - kind: diagram
        slot: diagram
        form: cluster.enclosed
        nodes:
          - { id: repo, label: "hokuchi", detail: "発信のリポジトリ" }
          - { id: talks, label: "talks/" }
          - { id: tools, label: "tools/" }
          - { id: adr, label: "docs/adr/" }
        emphasis: [tools]
    notes: |
      検証点: nodes[0] が枠 (ラベル + detail)、中身カードの等間隔、強調カード。

  - id: diagram-closure
    role: content
    idea: "diagram cluster.closure: 境界を描かない群"
    layout: diagram-stage
    elements:
      - kind: statement
        slot: headline
        text: "閉合 (cluster.closure) の検証"
      - kind: diagram
        slot: diagram
        form: cluster.closure
        nodes:
          - { id: simple, label: "簡潔" }
          - { id: active, label: "能動" }
          - { id: concrete, label: "具体" }
          - { id: consistent, label: "一貫" }
    notes: |
      検証点: 環状配置のみで群を知覚させる (線も境界も無い)、正多角形の頂点。

  - id: diagram-linked
    role: content
    idea: "diagram cluster.linked: 部分的なつながり"
    layout: diagram-stage
    elements:
      - kind: statement
        slot: headline
        text: "連結 (cluster.linked) の検証"
      - kind: diagram
        slot: diagram
        form: cluster.linked
        nodes:
          - { id: skill, label: "skill" }
          - { id: deck, label: "deck.yaml" }
          - { id: render, label: "render" }
          - { id: serve, label: "serve" }
        edges:
          - skill -> deck
          - deck -> render
          - { from: render, to: serve, label: "注釈" }
        emphasis: [deck]
    notes: |
      検証点: 環配置 + 矢印なしの連結線、エッジラベル、つながらないペアがあること。

  - id: diagram-radial
    role: content
    idea: "diagram radial.core: 中心と 5 つの周辺"
    layout: diagram-stage
    elements:
      - kind: statement
        slot: headline
        text: "中心と広がり (radial.core) の検証"
      - kind: diagram
        slot: diagram
        form: radial.core
        nodes:
          - { id: idea, label: "One Big Idea" }
          - { id: who, label: "聴衆" }
          - { id: story, label: "構成" }
          - { id: visual, label: "視覚" }
          - { id: words, label: "言葉" }
          - { id: time, label: "時間" }
        emphasis: [idea]
    notes: |
      検証点: nodes[0] が中心、残りが正多角形の頂点、edges 省略時の素のスポーク。

  - id: diagram-timeline
    role: content
    idea: "diagram flow.timeline: 日付つきの経緯 (ADR-0016)"
    layout: diagram-stage
    elements:
      - kind: statement
        slot: headline
        text: "経緯 (flow.timeline) の検証"
      - kind: diagram
        slot: diagram
        form: flow.timeline
        nodes:
          - { id: v1, label: "初版", detail: "2026-01" }
          - { id: v2, label: "image-stage", detail: "2026-03" }
          - { id: v3, label: "code/post/link", detail: "2026-05" }
          - { id: v4, label: "stat/table/versus", detail: "2026-06" }
          - { id: v5, label: "composition/timeline", detail: "2026-07" }
        emphasis: [v5]
    notes: |
      検証点: 等間隔配置 (日付には比例しない)、日付 (detail) が基線の上、
      出来事 (label) が基線の下、強調ノードの highlight 色。

  - id: chart-trend
    role: content
    idea: "chart trend: 折れ線 + 注釈アンカー + 共有スケール"
    layout: chart-stage
    elements:
      - kind: statement
        slot: headline
        text: "推移 (trend) と注釈の検証"
      - kind: chart
        slot: chart
        intent: trend
        message: "4月の改修を境に処理時間が下がり続ける"
        scale: shared-y
        data:
          x: ["1月", "2月", "3月", "4月", "5月", "6月"]
          series:
            - { label: "処理時間 (分)", values: [82, 78, 80, 55, 38, 24] }
        annotations:
          - { at: "4月", annotate: "レンダラ改修", style: highlight }
    notes: |
      検証点: 3 レイヤー (背景・データ・強調)、注釈の位置、共有 y スケール。

  - id: chart-comparison
    role: content
    idea: "chart comparison: 2 系列の棒とコア配色"
    layout: chart-stage
    elements:
      - kind: statement
        slot: headline
        text: "比較 (comparison) と 2 系列の検証"
      - kind: chart
        slot: chart
        intent: comparison
        message: "手作業よりツールの方が全工程で速い"
        scale: shared-y
        data:
          x: ["構成", "描画", "検証"]
          series:
            - { label: "手作業", values: [90, 70, 60] }
            - { label: "ツール", values: [35, 12, 20] }
    notes: |
      検証点: グループ棒の間隔、core 配色の系列差、軸ラベル。

  - id: bullets
    role: content
    idea: "bullets: 上限 5 項目とドットの整列"
    layout: list-stage
    elements:
      - kind: statement
        slot: headline
        text: "箇条書き (5 項目上限) の検証"
      - kind: bullets
        slot: list
        items:
          - "短い行"
          - "折り返しを見るための少し長い日本語の行"
          - "英数字 mix: render() / serve"
          - "ドットの整列"
          - "これが上限"
    notes: |
      検証点: 行間、ドット位置、長文項目の折り返し。

  # chart-comparison と隣接させない (軸域が違うので axis-lock の共有対象ではない)
  - id: chart-distribution
    role: content
    idea: "chart distribution: 階級が接するヒストグラム"
    layout: chart-stage
    elements:
      - kind: statement
        slot: headline
        text: "分布 (distribution) の検証"
      - kind: chart
        intent: distribution
        slot: chart
        message: "描画時間は 1〜2 秒の階級に集中する"
        data:
          x: ["<1s", "1-2s", "2-4s", "4-8s", ">8s"]
          series:
            - { label: "デッキ数", values: [4, 17, 11, 5, 2] }
    notes: |
      検証点: 隣接階級がほぼ接する棒 (comparison の離れた棒との差)。

  - id: image-src
    role: content
    idea: "image src: 実画像の full-bleed 描画と三分割配置"
    layout:
      areas:
        - { element: photo, cell: "1-2 / 1-6" }
        - { element: caption, cell: "3-4 / 4-5" }
      whitespace_min: 0.3
    elements:
      - kind: image
        id: photo
        src: ./assets/sample-photo.svg
        prompt: "夕暮れの山並み。手前は黒いシルエット、空は橙から紺へのグラデーション"
        treatment: full-bleed
        subject: third-right
      - kind: statement
        id: caption
        text: "実画像は src、意図は prompt に残す"
    notes: |
      検証点: src 画像のコピーと参照、object-fit cover、subject の寄せ。

  - id: image-stage
    role: content
    idea: "image-stage: 見出し + 実寸比の画像 (ADR-0015)"
    layout: image-stage
    elements:
      - kind: statement
        slot: headline
        text: "画像ステージ (image-stage) の検証"
      - kind: image
        slot: image
        src: assets/sample-photo.svg
    notes: |
      検証点: 実画像の縦横比 (960×720 = 4:3) で箱が決まること、角丸と
      ヘアライン枠、他パターンと揃った余白。

  - id: image-placeholder
    role: content
    idea: "image prompt: 実画像なしのプレースホルダ描画"
    layout:
      areas:
        - { element: ph, cell: "2-3 / 2-5" }
      whitespace_min: 0.3
    elements:
      - kind: image
        id: ph
        prompt: "朝焼けのキャンプ場で湯気の立つコーヒーを持つ手元。逆光、浅い被写界深度"
        treatment: framed
    notes: |
      検証点: プレースホルダの枠・バッジ・プロンプト表示。

  - id: code-javascript
    role: content
    idea: "code: シンタックスハイライトと行強調 (ADR-0016)"
    layout: code-stage
    elements:
      - kind: statement
        slot: headline
        text: "コードステージ (code-stage) の検証"
      - kind: code
        slot: code
        lang: javascript
        filename: render.mjs
        code: |
          export function measureCode(el, ctx, avail) {
            // 行数 × 行高と最長行の推定幅から箱を申告する
            const lines = el.code.split('\n');
            return { w: avail.w, h: lines.length * LH, render };
          }
        emphasis: ["2-3"]
    notes: |
      検証点: mono 書体、keyword/string/comment の配色、ファイル名ラベル帯、
      2-3 行目の強調帯と非強調行の dim。

  - id: post-x
    role: content
    idea: "post: SNS ポストの引用をスクリーンショットの代わりに構造で貼る (ADR-0016)"
    layout: post-stage
    elements:
      - kind: statement
        slot: headline
        text: "ポスト (post-stage) の検証"
      - kind: post
        slot: post
        text: "38 時間回した探索、ようやく収束した。原因は評価関数ではなく置換表だった"
        author: "架空 太郎"
        handle: "@example"
        date: "2015-04-12"
        avatar: ./assets/sample-photo.svg
        source: "https://x.com/example/status/123456789"
    notes: |
      検証点: avatar 画像の丸抜き、author (text_strong) と handle/date (muted)
      のヘッダ行、本文量から導出したカード幅 (最大 stage 幅の 7 割以内)。
      source を持つが、静的出力 (shot) はカードのまま変わらない (ADR-0017 —
      SPA 実埋め込みは file:// では動かない漸進的強化)。

  - id: link-zenn
    role: content
    idea: "link: 記事紹介を OGP カード + QR の定型で見せる (ADR-0016)"
    layout: link-stage
    elements:
      - kind: statement
        slot: headline
        text: "リンク (link-stage) の検証"
      - kind: link
        slot: link
        url: "https://zenn.dev/kyamamoto/articles/deck-as-code"
        title: "スライドを意図宣言型 YAML で書く"
        description: "ピクセルではなく意図を宣言し、レンダラが配置を導出する"
    notes: |
      検証点: url から常に導出する QR (誤り訂正 M、白面固定)、image 未指定時に
      テキストのみでカードが成立すること、url のドメイン表示。

  - id: transition-second
    role: transition
    idea: "転換: agenda が現在地を判定するための 2 つ目の章 (ADR-0016)"
    layout: statement-stage
    elements:
      - kind: statement
        slot: statement
        text: "ここから、応用の話"
        emphasis: ["応用"]
    notes: |
      検証点: このスライド自体は他の transition-inverted と同じ描画。
      後方の agenda-check がこの章を「現在地」として強調するための布石。

  - id: stat-big
    role: content
    idea: "stat: 数字 1 つで刺す (ADR-0016)"
    layout: stat-stage
    elements:
      - kind: statement
        slot: headline
        text: "統計 (stat-stage) の検証"
      - kind: stat
        slot: stat
        value: "38 時間"
        label: "最長の探索検証"
        context: "2015 年 4 月、世界コンピュータ将棋選手権の 3 週間前"
    notes: |
      検証点: scale.stat (160) を基準にした数字の大きさ、display 書体と
      text_strong 色、label/context の階層。

  - id: table-compare
    role: content
    idea: "table: 罫線最小の比較表 (ADR-0016)"
    layout: table-stage
    elements:
      - kind: statement
        slot: headline
        text: "表 (table-stage) の検証"
      - kind: table
        slot: table
        columns: ["", "画像で貼る", "構造で書く"]
        rows:
          - ["テーマ追従", "—", "✓"]
          - ["再レンダリング", "—", "✓"]
          - ["handout の可読性", "—", "✓"]
        emphasis: { cols: [3] }
    notes: |
      検証点: ヘッダ行の下罫線のみ (外枠・縞・セル背景は無し)、強調列の
      highlight 帯、列幅がセル内容から導出されること。

  - id: versus-approach
    role: content
    idea: "versus: 従来と提案の対比を左右のパネルで見せる (ADR-0016)"
    layout: versus-stage
    elements:
      - kind: statement
        slot: headline
        text: "対比 (versus-stage) の検証"
      - kind: versus
        slot: versus
        sides:
          - label: "画像を作って貼る"
            items: ["見た目は自由", "テーマから切断される", "直すたび作り直し"]
          - label: "構造で宣言する"
            items: ["語彙の範囲に縛られる", "テーマに追従する", "deck.yaml だけ直せばよい"]
            emphasis: true
    notes: |
      検証点: 左右対称の 2 パネル、emphasis: true 側の highlight 枠、
      もう片方の dim。

  - id: chart-composition-single
    role: content
    idea: "chart composition (単一系列): ドーナツと annotations の強調 (ADR-0016)"
    layout: chart-stage
    elements:
      - kind: statement
        slot: headline
        text: "構成比 (composition, 単一系列) の検証"
      - kind: chart
        slot: chart
        intent: composition
        message: "レンダラの改修時間は diagram 系の作業が半分を占める"
        data:
          x: ["diagram", "chart", "素材要素", "その他"]
          series:
            - { label: "改修時間の割合", values: [50, 20, 20, 10] }
        annotations:
          - { at: "diagram", annotate: "最多", style: highlight }
    notes: |
      検証点: 12 時起点・時計回りの扇形、各扇形の外側ラベル (カテゴリ + %)、
      annotations の style: highlight が指す項目が highlight 色になること。

  - id: chart-composition-multi
    role: content
    idea: "chart composition (複数系列): 100% 積み上げ棒 (ADR-0016)"
    layout: chart-stage
    elements:
      - kind: statement
        slot: headline
        text: "構成比 (composition, 複数系列) の検証"
      - kind: chart
        slot: chart
        intent: composition
        message: "新要素の実装は card 系の描画がどのリリースでも過半数を占める"
        data:
          x: ["0.3.0-a", "0.3.0-b", "0.3.0-c"]
          series:
            - { label: "card 系", values: [3, 2, 0] }
            - { label: "chart/diagram 系", values: [1, 1, 2] }
            - { label: "その他", values: [1, 1, 2] }
    notes: |
      検証点: 棒ごとに 100% へ正規化された積み上げ、層の色が core の宣言順に
      揃うこと (系列間の絶対量ではなく割合が主題)。

  - id: agenda-check
    role: content
    idea: "agenda: role: transition の statement から導出した目次と現在地の強調 (ADR-0016)"
    layout: agenda-stage
    elements:
      - kind: statement
        slot: headline
        text: "目次 (agenda-stage) の検証"
      - kind: agenda
        slot: agenda
    notes: |
      検証点: transition-inverted と transition-second の 2 章が文書順に
      列挙されること、このスライドの直前にある transition-second のみが
      現在地として highlight 色 + text_strong で強調され、transition-inverted
      は対等 (非強調) のままであること。

  - id: video-placeholder
    role: content
    idea: "video: poster なしのプレースホルダ描画 (ADR-0016)"
    layout: video-stage
    elements:
      - kind: statement
        slot: headline
        text: "動画 (video-stage) の検証"
      - kind: video
        slot: video
        src: assets/demo-annotation-loop.mp4
    notes: |
      検証点: poster 未指定時に surface の面 + ファイル名で代替すること、
      16:9 の箱、線描 (塗りベタでない) の再生グリフが中央に重なること。

  - id: raw
    role: content
    idea: "raw: 語彙外の 1 枚を SVG で埋め込む脱出口"
    layout:
      areas:
        - { element: custom, cell: "1-4 / 2-5" }
      whitespace_min: 0.3
    elements:
      - kind: raw
        id: custom
        svg: |
          <svg xmlns="http://www.w3.org/2000/svg" width="640" height="240" viewBox="0 0 640 240">
            <rect x="8" y="8" width="624" height="224" rx="16" fill="none" stroke="#fa6e78" stroke-width="3" stroke-dasharray="10 6"/>
            <text x="320" y="110" text-anchor="middle" font-size="28" fill="#111827" font-family="sans-serif">raw 要素 — 語彙で表せない 1 枚のための口</text>
            <text x="320" y="160" text-anchor="middle" font-size="18" fill="#4b5563" font-family="sans-serif">waiver 必須 / デッキの 1 割まで (raw-budget)</text>
          </svg>
        waiver: "レンダラ検証のため、語彙にない見た目 (破線枠) を意図的に埋め込む"
    notes: |
      検証点: インライン SVG の描画、raw-budget lint が 1/13 で発火しないこと。

  - id: closer
    role: closer
    idea: "クローザ: 行動喚起で閉じるバンパー"
    layout: statement-stage
    elements:
      - kind: statement
        slot: statement
        text: "変えたら、まずこのデッキを見る"
        emphasis: ["このデッキ"]
    notes: |
      検証点: closer の hero サイズとバンパー背景。
